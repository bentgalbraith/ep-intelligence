{% extends "tool_base.html" %}
{% set page_title = "Validate Signatures" %}

{% block form_panel %}
<form class="ep-form" id="sig-form">
    <label class="field-label">Upload PDFs</label>
    <div class="file-upload-group">
        <div class="file-drop-zone file-drop-zone--compact" id="drop-zone">
            <input type="file" id="pdf-input" accept=".pdf,application/pdf" multiple hidden>
            <svg class="drop-zone-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/>
            </svg>
            <span class="drop-zone-text">Drag & drop PDF(s) here, or click to browse</span>
        </div>
        <div class="file-list" id="file-list"></div>
    </div>
    <button type="submit" class="btn-pill btn-generate" id="btn-validate" disabled>
        <span class="btn-label">Validate</span>
        <span class="spinner" hidden></span>
    </button>
</form>
{% endblock %}

{% block tool_scripts %}
<script src="{{ url_for('static', filename='js/validate-signatures.js') }}"></script>
<script>
    initValidateSignatures({
        submitUrl: {{ url_for('api_validate_signatures')|tojson }},
        statusUrl: {{ url_for('api_validate_signatures_status', job_id='__JOB__')|tojson }},
        cropUrl: {{ url_for('api_validate_signatures_crop', job_id='__JOB__', item_id='__ITEM__')|tojson }},
    });
</script>
{% endblock %}
